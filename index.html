<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تولدت مبارک ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;text-align:center;color:#f5d98b;
 font-family:Tahoma,sans-serif;
 background:radial-gradient(circle at top,#49351c,#100d09 65%);
}
.card{
 width:90%;max-width:420px;padding:42px 24px;
 border:1px solid #b89550;border-radius:24px;
 background:rgba(0,0,0,.45);
 box-shadow:0 0 35px #9b702b44;
}
h1{font-size:34px;margin:12px 0;color:#f7d98d}
.artist{color:#d6b66e;font-size:17px}
.line{width:65px;height:1px;background:#b89550;margin:25px auto}
button{
 border:0;border-radius:40px;padding:15px 35px;
 background:linear-gradient(135deg,#f9df9b,#b88632);
 color:#211606;font-size:17px;font-weight:bold;
 cursor:pointer;
}
p{line-height:2;color:#e8d6ad;font-size:15px}
</style>
</head>
<body>
<div class="card">
<div>✦ یک آهنگ برای تو ✦</div>
<h1>کجایی بگو</h1>
<div class="artist">مجید رضوی</div>
<div class="line"></div>
<button onclick="location.href='https://uupload.ir/view/kojaei-begoo_dt3c1.mp3/'">
▶ پخش آهنگ
</button>
<p>تولدت مبارک؛ برای قشنگ‌ترین اتفاق زندگی من ❤️</p>
</div>
</body>
</html>
